<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Sleuth</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --limewash: #eef0ea;
  --plaster: #e2e6dd;
  --slate: #23302e;
  --lichen: #55654f;
  --woad: #2f5d8a;
  --weld: #f0d873;
  --rail: #b9c3b5;
  --edge: #76836f;
  --danger: #9b2c2c;
  --bg: var(--limewash);
  --panel: var(--plaster);
  --ink: var(--slate);
  --muted: var(--lichen);
  --accent: var(--woad);
  --mark: var(--weld);
  --on-accent: #ffffff;
  --face-edge: rgb(35 48 46 / .3);
  --sun: #e2a52a;
  --moon: #f3f1e4;
  --day-sky: #bcd8ea;
  --night-sky: #26324c;
  --on-mark: #fff;
  --serif: "Alegreya", Georgia, "Times New Roman", serif;
  --ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a2226;
    --panel: #222c31;
    --ink: #dce3dc;
    --muted: #9aab99;
    --accent: #8fb4de;
    --mark: #6a5714;
    --rail: #3f4d50;
    --edge: #6b7a7c;
    --danger: #f19a9a;
    --on-accent: #10202f;
    --face-edge: rgb(255 255 255 / .3);
    --sun: #f0c45a;
    --moon: #eef0ea;
    --day-sky: #4f7896;
    --night-sky: #141c30;
    --on-mark: #1a2226;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--ui);
  overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.visually-hidden {
  position: absolute; top: 0; left: 0; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 20rem;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: 100dvh;
}
.bottom { grid-column: 1 / -1; }
header {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .5rem 1.5rem;
  padding: .6rem 1.25rem;
}
.hud {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .35rem 1.5rem;
  margin-left: auto; font-size: .85rem;
}
.hud p { margin: 0; }
.menu { display: contents; }
.menu-toggle { display: none; }
h1 { font: 500 1.5rem/1.2 var(--serif); margin: 0; }
.conn { font-size: .875rem; color: var(--muted); }
.conn::before {
  content: ""; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%;
  background: var(--muted); margin-right: .4rem; vertical-align: .05rem;
}
.conn[data-state="live"]::before { background: var(--accent); }
.conn[data-state="down"] { color: var(--danger); }
.conn[data-state="down"]::before { background: var(--danger); }
.tabs { display: none; }

main {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.feed {
  flex: 1;
  overflow-y: auto;
  list-style: none;
  margin: 0;
  padding: .5rem 1.25rem 1.5rem;
}
.feed:empty { flex: 0; padding: 0; }
.empty { flex: 1; display: grid; place-content: center; color: var(--muted); text-align: center; padding: 1rem; margin: 0; }
.empty[hidden] { display: none; }
.feed > li { max-width: 46rem; border-bottom: 1px solid var(--rail); }
.line, .fold-head { display: flex; align-items: flex-start; gap: .5rem; margin: 0; padding: .35rem 0; }
.line-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.line.speech .line-text { font: italic 1.05rem/1.4 var(--serif); }
.line.quiet, .fold-head { font-size: .875rem; color: var(--muted); }
.line.hint { font-size: .875rem; color: var(--ink); border-left: 3px solid var(--accent); padding-left: .6rem; }
.fold-words { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.fold-more { flex: none; }
.fold:not(.open) .fold-lines { display: none; }
.fold-lines { list-style: none; margin: 0; padding: 0 0 .4rem 1.75rem; }
.fold-lines > li { padding: .15rem 0; }
.talk-line { font-size: .875rem; }
.meta { margin: 0; font-size: .875rem; color: var(--muted); }
.fresh { animation: arrive 280ms ease-out; }
@keyframes arrive { from { opacity: 0; transform: translateY(.4rem); } to { opacity: 1; transform: none; } }
.brush { font: italic 1rem/1.4 var(--serif); color: var(--ink); }
.where, .clock { margin: 0; font-size: .85rem; color: var(--muted); }
.clock { color: var(--ink); font-variant-numeric: tabular-nums; }
.sky { display: flex; align-items: center; justify-content: flex-end; gap: .5rem; }
.sky svg { width: 4.5rem; height: 2.4rem; flex: none; }
.sky .horizon { stroke: var(--edge); stroke-width: 1.5; }
.sky .wheel { transform-box: view-box; transform-origin: 32px 33px; }
.sky .day { fill: var(--day-sky); }
.sky .night { fill: var(--night-sky); }
.sky .sun { fill: var(--sun); stroke: var(--sun); stroke-width: 1.6; stroke-linecap: round; }
.sky .moon, .sky .star { fill: var(--moon); }

.bottom { border-top: 1px solid var(--rail); background: var(--bg); }
.composer { padding: .75rem 1.25rem 1rem; }
input[type="text"], input[type="search"] {
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 6px;
  padding: .5rem .65rem;
  min-width: 0;
}
.primary {
  background: var(--accent);
  color: var(--on-accent);
  border: 0;
  border-radius: 6px;
  padding: .5rem 1.1rem;
  font-weight: 700;
  cursor: pointer;
}
.primary:disabled { opacity: .6; cursor: progress; }
.say-status { margin: .4rem 0 0; min-height: 1.25rem; font-size: .875rem; color: var(--muted); }
.say-status.error { color: var(--danger); }
.resting { margin: 0 0 .4rem; font-size: .875rem; color: var(--muted); }

aside {
  background: var(--panel);
  overflow-y: auto;
  padding: 0 1.25rem 1.5rem;
  min-height: 0;
}
h2 { font-size: 1rem; margin: 1rem 0 .5rem; }
h3 { font-size: .875rem; color: var(--muted); font-weight: 400; margin: .9rem 0 .2rem; }
.case { flex: none; background: var(--panel); border-bottom: 1px solid var(--rail); padding: .6rem 1.25rem; }
.case[hidden] { display: none; }
.case p { margin: 0; max-width: 46rem; }
.case p.none { color: var(--muted); font-size: .875rem; }
.notebook { margin: .4rem 0 0; padding-left: 1.25rem; max-width: 46rem; font-size: .85rem; }
.notebook:empty { display: none; }
.publish { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin: .5rem 0 0; font-size: .875rem; }
.publish[hidden] { display: none; }
.publish p { flex-basis: 100%; }
#search { width: 100%; }
.find { display: contents; }
.find-status { margin: .25rem 0 0; min-height: 1.25rem; font-size: .8rem; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: .5rem; margin-top: .25rem; }
.tile { background: var(--bg); border: 1px solid var(--rail); border-radius: 6px; padding: .35rem .5rem .45rem; min-width: 0; }
.tile.open { grid-column: 1 / -1; }
.place {
  display: flex; justify-content: space-between; gap: .5rem; width: 100%;
  background: none; border: 0; padding: 0; text-align: left; font-size: .875rem; font-weight: 700; cursor: pointer;
}
.place span { color: var(--muted); font-weight: 400; }
.faces { display: flex; flex-wrap: wrap; gap: 5px; margin-top: .3rem; }
.pick, .more { background: none; border: 0; padding: 0; border-radius: 5px; cursor: pointer; }
.more { font-size: .75rem; color: var(--muted); padding: 0 .2rem; }
.face { position: relative; display: inline-block; flex: none; line-height: 0; }
.face canvas {
  width: 24px; height: 24px; border-radius: 5px; image-rendering: pixelated;
  outline: 1px solid var(--face-edge); outline-offset: -1px;
}
.face.big canvas { width: 32px; height: 32px; border-radius: 6px; }
.tag { margin-left: .4rem; padding: 0 .35rem; border-radius: 3px; background: var(--mark); color: var(--on-mark); font-weight: 700; }
.glyph { color: var(--mark); font-weight: 700; margin-right: .25rem; }
.searching .pick:not(.hit) { opacity: .35; }
.pick.hit canvas { outline: 2px solid var(--accent); outline-offset: 1px; }
.sort { display: flex; align-items: center; gap: .5rem; margin: .1rem 0 0; font-size: .85rem; color: var(--muted); }
.sort select { background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 6px; padding: .2rem .4rem; }
.rows { list-style: none; margin: .3rem 0 0; padding: 0; max-height: min(18rem, 40dvh); overflow-y: auto; }
.row {
  display: flex; gap: .6rem; align-items: flex-start; width: 100%; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--rail); padding: .4rem .25rem; cursor: pointer;
}
.row:hover, .row[aria-current="true"] { background: var(--panel); }
.who { min-width: 0; font-size: .875rem; line-height: 1.35; overflow-wrap: anywhere; }
.who small { color: var(--muted); }
.scroll-more { margin: .2rem 0 0; min-height: 1rem; font-size: .75rem; color: var(--muted); text-align: center; }
.who .hint { display: block; font: italic .95rem/1.35 var(--serif); color: var(--ink); }
.card {
  position: fixed; top: var(--top, 4rem); right: calc(20rem + .75rem); z-index: 3;
  width: 19rem; max-height: calc(100dvh - 2rem); overflow-y: auto;
  background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; padding: .75rem .9rem;
  box-shadow: 0 6px 24px rgb(0 0 0 / .2);
}
.card[hidden] { display: none; }
.card h3 { color: var(--ink); font-size: 1.05rem; font-weight: 700; margin: 0; }
.card p { margin: .35rem 0; font-size: .9rem; }
.card dl { margin: .35rem 0; font-size: .9rem; }
.card dt { color: var(--muted); font-size: .8rem; }
.card dd { margin: 0 0 .35rem; }
.card dd .brush, .card dd .passed, .card dd .known { display: block; }
.card dd .known[hidden] { display: none; }
.card .rel { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.card .actions { display: flex; gap: .5rem; align-items: center; margin-top: .5rem; }
.ask { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .5rem; }
.ask-status { margin: .25rem 0 0; min-height: 1.25rem; font-size: .8rem; color: var(--muted); }
.ask-status.error { color: var(--danger); }
.tile-act { display: block; margin-top: .3rem; font-size: .8rem; }
.tile-act[aria-disabled="true"] { cursor: default; text-decoration: none; }
.usage { font-size: .75rem; color: var(--muted); }
.usage:empty { display: none; }
.linkish { background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0; font-size: .875rem; }

@media (max-width: 1000px) {
  .app { grid-template-columns: minmax(0, 1fr) 17rem; }
  aside { padding: 0 .75rem 1.5rem; }
  .card { right: calc(17rem + .75rem); }
}
@media (max-width: 1200px) {
  .conn { margin-left: auto; }
  .hud { order: 5; flex: 1 0 100%; margin-left: 0; justify-content: flex-start; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  header { padding: .6rem 1rem; align-items: center; }
  .app:not([data-tab="hear"]) #hear-panel,
  .app:not([data-tab="village"]) #town { display: none; }
  .tabs { display: flex; border-bottom: 1px solid var(--rail); }
  .tabs button {
    flex: 1; min-height: 44px; background: none; border: 0; border-top: 3px solid transparent;
    padding: 0; cursor: pointer; font-size: .9rem; color: var(--muted);
  }
  .tabs button[aria-selected="true"] { border-top-color: var(--accent); color: var(--ink); font-weight: 700; }
  /* One line: the name, the day, the connection dot and a menu for the rest. */
  header { position: relative; flex-wrap: nowrap; gap: .5rem; min-height: 56px; padding: .25rem .5rem .25rem 1rem; }
  h1 { font-size: 1.2rem; }
  .hud { display: contents; }
  .sky { order: 1; flex-direction: column; gap: 0; }
  .sky svg { width: 2.4rem; height: 1.3rem; }
  .clock { font-size: .7rem; line-height: 1.2; white-space: nowrap; }
  .conn { order: 3; margin-left: auto; font-size: 0; }
  .conn::before { width: .6rem; height: .6rem; margin: 0; }
  .menu-toggle {
    order: 4; display: grid; place-items: center; flex: none; width: 44px; height: 44px;
    background: none; border: 0; border-radius: 6px; font-size: 1.25rem; cursor: pointer;
  }
  .menu {
    display: none; position: absolute; top: calc(100% - .25rem); right: .5rem; z-index: 6; flex-direction: column; gap: .25rem;
    min-width: 12rem; max-width: calc(100vw - 1rem); padding: .5rem .75rem; background: var(--bg);
    border: 1px solid var(--edge); border-radius: 8px; box-shadow: 0 6px 24px rgb(0 0 0 / .2);
  }
  .menu.open { display: flex; }
  .menu .where, .menu .usage { font-size: .8rem; }
  aside { padding: .5rem 1rem 1.5rem; }
  .feed { padding: .5rem 1rem 1rem; }
  .composer { padding: .6rem 1rem .8rem; }
  .say-status:empty { min-height: 0; margin: 0; }
  .tile-act, .walk-there { min-height: 2.25rem; }
  /* The village as one row per place: name and count, the faces, and Walk or Look around. */
  #town h2 { margin: .25rem 0 .4rem; }
  /* The villager card sticks to the panel's very foot, so the panel ends without padding. */
  #town { padding-bottom: 0; }
  #people { margin-bottom: 1.5rem; }
  .find { display: flex; flex-wrap: wrap; align-items: center; gap: 0 .5rem; }
  #search { flex: 1 1 8rem; width: auto; min-height: 44px; }
  .find .sort { order: 2; margin: 0; }
  .find .sort label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .sort select { min-height: 44px; max-width: 8.5rem; }
  .find-status { order: 3; flex: 1 0 100%; min-height: 0; }
  .tiles { display: block; }
  .tile {
    display: grid; grid-template-columns: 4rem minmax(0, 1fr) 3.25rem; align-items: center; gap: 0 .4rem;
    padding: .2rem 0; background: none; border: 0; border-bottom: 1px solid var(--rail); border-radius: 0;
  }
  .tile .place { flex-direction: column; gap: 0; margin: 0; line-height: 1.25; cursor: default; overflow-wrap: anywhere; }
  .tile .faces { grid-column: 2; grid-row: 1; margin: 0; gap: 0; }
  .tile .tile-act { grid-column: 3; grid-row: 1; margin: 0; min-height: 44px; padding: 0; font-size: .75rem; line-height: 1.15; text-align: right; }
  .tiles .pick { display: grid; place-items: center; width: 44px; height: 44px; }
  .tiles .face canvas { width: 30px; height: 30px; border-radius: 6px; }
  .card {
    position: sticky; top: auto; bottom: 0; right: auto; width: auto; max-height: 45dvh;
    margin: 0 -1rem; border-radius: 10px 10px 0 0; border-width: 1px 0 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .fresh { animation: none; }
}
</style>
</head>
<body>
<div class="app" id="app" data-tab="hear">
  <header>
    <h1>Sleuth</h1>
    <div class="hud">
      <div class="sky" id="sky">
        <svg viewBox="0 0 64 34" aria-hidden="true">
          <defs>
            <clipPath id="above"><rect width="64" height="33"/></clipPath>
            <mask id="crescent"><rect x="20" y="40" width="24" height="24" fill="white"/><circle cx="35" cy="50" r="5.2" fill="black"/></mask>
          </defs>
          <g clip-path="url(#above)">
            <g class="wheel" id="wheel">
              <path class="day" d="M1 33 A31 31 0 0 1 63 33 Z"/>
              <path class="night" d="M1 33 A31 31 0 0 0 63 33 Z"/>
              <g class="sun"><circle cx="32" cy="14" r="5"/>
                <path d="M32 5v2.5M32 21v2.5M23 14h2.5M38.5 14h2.5M25.6 7.6l1.8 1.8M36.6 18.6l1.8 1.8M25.6 20.4l1.8-1.8M36.6 9.4l1.8-1.8"/></g>
              <circle class="moon" cx="32" cy="52" r="6" mask="url(#crescent)"/>
              <circle class="star" cx="18" cy="45" r=".9"/><circle class="star" cx="46" cy="47" r=".9"/>
              <circle class="star" cx="24" cy="58" r=".7"/><circle class="star" cx="42" cy="59" r=".7"/>
            </g>
          </g>
          <line class="horizon" x1="0" y1="33" x2="64" y2="33"/>
        </svg>
        <p class="clock" id="clock"></p>
      </div>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="More" aria-expanded="false" aria-controls="menu">⋯</button>
      <div class="menu" id="menu">
        <p class="where" id="where"></p>
        <p class="usage" id="usage"></p>
      </div>
    </div>
    <span class="conn" id="conn" data-state="connecting" role="status">Connecting</span>
  </header>

  <main id="hear-panel">
    <section class="case" id="case" hidden><p id="case-text" class="none">No open case</p>
      <ol class="notebook" id="notebook" aria-label="Your notebook"></ol>
      <form class="publish" id="publish" hidden>
        <button type="button" class="linkish" id="pull">Pull records here</button>
        <label for="culprit">Who did it</label>
        <select id="culprit"><option value="">Choose a resident</option></select>
        <button type="submit" class="primary">Publish</button>
        <p class="ask-status" id="case-status" role="status"></p>
      </form></section>
    <div class="stage">
      <ol class="feed" id="feed" role="log" aria-live="off" aria-label="What the town is saying"></ol>
      <p class="empty" id="empty">Walk somewhere and talk to the people there.</p>
    </div>
  </main>

  <aside id="town" aria-label="Residents">
    <h2 id="people-heading">Residents</h2>
    <div class="find">
      <label for="search" class="visually-hidden">Find a resident</label>
      <input type="search" id="search" placeholder="Find by name, job, looks, or place" autocomplete="off">
      <p class="find-status" id="find-status" role="status"></p>
      <p class="sort"><label for="sort">Sort</label>
        <select id="sort">
          <option value="place">By place</option>
          <option value="notes">By what you know</option>
        </select>
      </p>
    </div>
    <div class="tiles" id="people"></div>
    <section class="card" id="card" role="dialog" aria-labelledby="card-title" hidden></section>
  </aside>

  <div class="bottom">
    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-hear" aria-controls="hear-panel" aria-selected="true">Hear</button>
      <button type="button" role="tab" id="tab-village" aria-controls="town" aria-selected="false" tabindex="-1">Residents</button>
    </nav>
    <div class="composer">
      <p class="resting" id="resting" role="status" hidden></p>
      <p class="say-status" id="status" role="status"></p>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const feed = $("feed");
const MAX_ITEMS = 1000;
let villagers = [];
let villagersKey = "";
let places = [];
let boot = null;
let lastId = 0;
let selected = null;
let rover = null;
let pointing = false;
let peopleStale = false;
let notes = {};
let cardOpener = null;
let here = null;
let listenUntil = null;
const RESTING = "The town is resting for today. Come back after midnight UTC.";
const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)");
// What the feed's arrow keys move between; the feed itself is one tab stop.
const ROVE = ".fold-more";
const OPEN_KEY = "sleuth-open-place";
const SORT_KEY = "sleuth-sort";
const TAB_KEY = "sleuth-tab";
const FACES_SHOWN = 11;
const phone = matchMedia("(max-width: 760px)");

function el(tag, { dataset, ...props } = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  Object.assign(node.dataset, dataset);
  node.append(...children.filter((c) => c != null));
  return node;
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

// One feed line: loud, speech, quiet or hint.
function line(tone, ...children) {
  return el("li", { className: `line ${tone}` }, el("span", { className: "line-text" }, ...children));
}

// A quiet line that folds a listen's lines behind a toggle.
function fold(dataset) {
  const open = Boolean(dataset.listen);
  const block = el("li", { className: open ? "fold open" : "fold", dataset });
  const toggle = el("button", { type: "button", className: "linkish fold-more", tabIndex: -1, ariaExpanded: String(open),
    onclick: () => {
      toggle.ariaExpanded = String(block.classList.toggle("open"));
      countFold(block);
    } });
  block.append(el("p", { className: "fold-head" }, el("span", { className: "fold-words" }), toggle),
    el("ol", { className: "fold-lines" }));
  return block;
}

function countFold(block) {
  const n = block.querySelector(".fold-lines").children.length;
  const head = block.querySelector(".fold-head");
  const toggle = head.querySelector(".fold-more");
  head.querySelector(".fold-words").textContent = foldWords(block, n);

}

function foldWords(block, n) {
  const { place, ended } = block.dataset;
  return `Recently said at the ${place} · ${plural(n, "line")}`;
}

// A line in a fold.
function addLine(block, e, fresh) {
  block.querySelector(".fold-lines").append(el("li", { className: fresh ? "talk-line fresh" : "talk-line" },
    el("b", { textContent: e.speaker_name }), ": ", e.text));

// The newest listen at place that has not ended yet.
function listenBlock(place) {
  return [...feed.querySelectorAll(`.fold[data-listen][data-place="${CSS.escape(place)}"]:not([data-ended])`)].pop() || null;
}

// A listen opens a fold of the lines said here lately; its end closes the newest open one.
function listened(e, fresh) {
  if (e.ended) {

    const block = listenBlock(e.place);
    if (block) endListen(block);
    return null;
  }
  setListening(e.until);
  const block = fold({ listen: String(e.id), place: e.place });
  for (const said of e.lines) addLine(block, said, fresh);

}

// The evidence the player has gathered, once each, as "kind · from · clock · text", each with a box to cite it.

function render(e, fresh) {
  switch (e.kind) {
    case "case":
      // A shared case waits until the player's private case closes.

      return null;
    case "case_closed":
      if ($("case").dataset.case === e.case_id) {
        setCase(null);

      }
      return e.text ? line("quiet", e.text) : null;
    case "pulled":
      note(e.records);
      return line("quiet", e.text);
    case "episode":

    case "post":
      return line("speech", el("span", { className: "tag", textContent: "App" }), " ", `${e.speaker}: “${e.text}”`);
    case "place":

// The player's notes: what each villager answered in an interview, once each, in order.

// Pixel faces: a 12x12 head and shoulders, with hair, coat and height from the resident's traits.
const SKIN = ["#f1d3b3", "#e2b48f", "#c98f63", "#9c6644", "#6e4630", "#f3dcc8"];
const TINT = ["#dfe6d6", "#e6dfd2", "#d9e0e8", "#e8dcdc", "#dde4df"];
const faces = new Map();

function seeded(seed) {
  let h = 2166136261;
  for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
}

function drawFace(v) {
  const canvas = el("canvas", { width: 12, height: 12 });
  const g = canvas.getContext("2d");
  const r = seeded(v.id);
  const pick = (list) => list[Math.floor(r() * list.length)];
  const { hair, coat, height = 1 } = v.face || {};
  const clothes = coat || "#6b5b4a";
  const dy = 1 - height;
  const px = (i, j, color) => { g.fillStyle = color; g.fillRect(i, j + dy, 1, 1); };
  const rect = (i0, i1, j0, j1, color) => { for (let i = i0; i < i1; i++) for (let j = j0; j < j1; j++) px(i, j, color); };
  g.fillStyle = pick(TINT);
  g.fillRect(0, 0, 12, 12);
  const skin = pick(SKIN);
  rect(2, 10, 9, 12 - dy, clothes);
  rect(1, 11, 11, 12 - dy, clothes);
  rect(4, 8, 8, 9, skin);
  rect(3, 9, 3, 8, skin);
  const style = Math.floor(r() * 4);
  if (hair) {
    rect(3, 9, 2, 3, hair);
    rect(2, 10, 3, 4, hair);
    if (style >= 1) { px(2, 4, hair); px(9, 4, hair); }
    if (style >= 2) { rect(2, 3, 5, 7, hair); rect(9, 10, 5, 7, hair); }
    if (style === 3) rect(4, 8, 1, 2, hair);
  }
  px(4, 5, "#2a2a2a");
  px(7, 5, "#2a2a2a");
  if (hair && r() < 0.35) { rect(4, 8, 7, 8, hair); px(3, 6, hair); px(8, 6, hair); }
  else { px(5, 7, "#a5584a"); px(6, 7, "#a5584a"); }
  return canvas;
}

// A copy of the resident's face; each is drawn once and then copied.
function faceFor(v) {
  if (!faces.has(v.id)) faces.set(v.id, drawFace(v));
  const canvas = el("canvas", { width: 12, height: 12, ariaHidden: "true" });
  canvas.getContext("2d").drawImage(faces.get(v.id), 0, 0);
  return canvas;
}

function faceWith(v, big = false) {

// A smooth scroll to new lines; lines arriving mid-scroll keep following even though the feed isn't at the bottom yet.
let following = 0;
function followFeed(fresh) {

  feed.scrollTo({ top: feed.scrollHeight, behavior: smooth ? "smooth" : "auto" });
  if (!smooth) return;
  clearTimeout(following);
  following = setTimeout(() => { following = 0; }, 600);

function nearBottom() {

function roveItems() {
  return [...feed.querySelectorAll(ROVE)].filter((n) => n.getClientRects().length);

// Roving focus: the feed is one tab stop, and arrow keys move between its buttons.
function setRover(node) {
  if (rover) rover.tabIndex = -1;
  rover = node;
  if (rover) rover.tabIndex = 0;
}

// ponytail: the cap counts top-level items, so one fold can grow without limit within a game; split long folds if a
// game outgrows that.
function prune() {
  while (feed.children.length > MAX_ITEMS) {
    const node = feed.firstElementChild;
    if (node.contains(rover)) rover = null;
    node.remove();
  }
}

function addEvents(events, fresh) {
  const stick = feed.children.length === 0 || nearBottom() || following !== 0;
  for (const e of events) {
    if (e.id <= lastId) continue;
    lastId = e.id;
    const node = render(e, fresh);
    if (!node) continue;
    if (fresh) node.classList.add("fresh");
    feed.append(node);
  }
  prune();
  if (learned) {
    learned = false;
    refreshVillagers();
  }
  if (!rover) setRover(roveItems()[0] || null);
  $("empty").hidden = feed.children.length > 0;
  if (stick) followFeed(fresh);
}

function capital(word) {
  return `${word[0].toUpperCase()}${word.slice(1)}`;
}

// Residents matching a search, best first: name, then job or looks, then place; ties keep name order.
function matches(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const scored = [];
  for (const v of villagers) {
    const name = v.name.toLowerCase();
    const score = name.startsWith(q) || name.includes(` ${q}`) ? 4
      : name.includes(q) ? 3 : v.occupation.toLowerCase().includes(q) || v.looks.includes(q) ? 2 : v.place.includes(q) ? 1 : 0;
    if (score) scored.push([score, v]);
  }
  return scored.sort((x, y) => y[0] - x[0]).map(([, v]) => v);
}

function storedPlace() {

// The open tile: the place a search opened, else the player's choice, else where the player is, else the first.
function openPlace(order) {
  const want = searchPlace || chosenPlace || here;
  return order.includes(want) ? want : order[0];
}
let chosenPlace = storedPlace();
let searchPlace = null;

// Ways to order villagers inside a tile; each falls back to name order.
const SORTS = {
  place: () => 0,
  notes: (a, b) => Number(!noteOf(a.id).length) - Number(!noteOf(b.id).length),
};

function sorted(crowd) {
  const by = SORTS[$("sort").value] || SORTS.place;

}

function faceButton(v, hits) {

    type: "button", tabIndex: -1, className: hits.has(v.id) ? "pick hit" : "pick",
    title: `${v.name}, ${v.occupation}: ${v.looks}`, dataset: { id: v.id },

// Search hits come first, ahead of the cut; a phone shows everyone.
function closedTile(place, crowd, hits) {
  const lead = (v) => hits.has(v.id);

  const shown = phone.matches ? first : first.slice(0, FACES_SHOWN);
  const more = crowd.length - shown.length;
  const buttons = shown.map((v) => faceButton(v, hits));
  // On a phone a place's faces are one tab stop; the arrow keys move along them.
  if (phone.matches && buttons.length) buttons[0].tabIndex = 0;
  return el("div", { className: "faces" }, ...buttons,
    more > 0 ? el("button", { type: "button", tabIndex: -1, className: "more", textContent: `+${more}`, onclick: () => choosePlace(place) }) : null);
}

function openTile(crowd, hits) {
  const list = hits.size ? crowd.filter((v) => hits.has(v.id)) : crowd;
  if (!list.length) return el("p", { className: "meta", textContent: hits.size ? "No one here matches." : "No one is here." });
  const rows = el("ul", { className: "rows" }, ...list.map((v) => el("li", {}, el("button", {
    type: "button", className: "row", dataset: { id: v.id },
    ariaCurrent: String(v.id === selected), onclick: (ev) => inspect(v.id, ev.currentTarget),
  }, faceWith(v, true), who(v, `${v.occupation}: ${v.looks}`)))));
  const more = el("p", { className: "scroll-more", ariaHidden: "true" });

  const cue = () => {
    const rowHeight = rows.firstElementChild.offsetHeight || 1;
    const below = Math.round((rows.scrollHeight - rows.scrollTop - rows.clientHeight) / rowHeight);
    more.textContent = below > 0 ? `+${below} more, scroll` : "";
  };
  rows.addEventListener("scroll", cue);
  requestAnimationFrame(cue);
  return el("div", {}, rows, more);
}

// Name, a detail line, and the last answer.
function who(v, detail) {
  const answers = noteOf(v.id);

    answers.length ? el("span", { className: "hint", textContent: `“${answers.at(-1)}”` }) : null);

function focusKey(node) {

function renderVillagers() {
  const people = $("people");
  const key = people.contains(document.activeElement) ? focusKey(document.activeElement) : null;
  const query = $("search").value;
  const found = matches(query);
  const hits = new Set(found.map((v) => v.id));
  const order = [...places, ...[...new Set(villagers.map((v) => v.place))].filter((p) => !places.includes(p)).sort()];
  const open = openPlace(order);
  $("people-heading").textContent = `Residents (${villagers.length})`;
  people.classList.toggle("searching", hits.size > 0);
  people.replaceChildren(...order.map((place) => {
    const crowd = sorted(villagers.filter((v) => v.place === place));
    const count = hits.size ? `${crowd.filter((v) => hits.has(v.id)).length} of ${crowd.length}` : String(crowd.length);
    const label = hits.size ? `${capital(place)}, ${count} residents match` : `${capital(place)}, ${count} residents`;
    // A phone has no open tile: every place is one row with its faces and its Walk or Look around.

        el("p", { className: "place" }, el("span", { className: "visually-hidden", textContent: label }),
          el("b", { ariaHidden: "true", textContent: capital(place) }), el("span", { ariaHidden: "true", textContent: count })),

        onclick: () => choosePlace(place),

        capital(place), el("span", { textContent: count })),

  const said = !query.trim() ? ""
    : found.length ? `${found.length} found. Best match: ${found[0].name}, at the ${found[0].place}.`
    : "No one matches. Try part of a name, a job, or a look like \"red-haired\".";

// Moves and notes arrive every second; hold them while someone is pointing at or tabbing through the tiles.

$("people").addEventListener("focusout", () => setTimeout(flushVillagers));
$("people").addEventListener("keydown", (ev) => {

// The villager card: a popover beside the tiles, or a sheet at the foot of the Village tab on a phone.
let cardRequest = 0;
async function inspect(id, opener) {

  const card = $("card");

        answers.length ? null : el("span", { className: "known nothing", textContent: "Nothing yet." }),
        ...answers.map((h) => el("span", { className: "brush", textContent: `“${h}”` })))),
    el("div", { className: "ask-slot", dataset: { id: body.id, name: body.name, place: body.place } }),
    el("div", { className: "actions" },
      el("button", { className: "linkish", type: "button", textContent: "Close", onclick: closeCard })),
  ];
}

function closeCard() {
  const opener = cardOpener;
  const inside = $("card").contains(document.activeElement);
  cardRequest++;
  $("card").hidden = true;
  selected = null;
  cardOpener = null;
  $("people").querySelectorAll(".row[aria-current='true']").forEach((row) => { row.ariaCurrent = "false"; });
  if (!opener || !inside) return;
  const node = opener.node.isConnected ? opener.node : $("people").querySelector(`[data-id="${CSS.escape(opener.id)}"]`);
  if (node) node.focus();
}

const PHASES = ["morning", "afternoon", "evening", "night"];
let clockAt = null;

// The server says where the day is; the page runs the clock between its ticks, never past the current part of the day.
function setClock(t) {
  const fraction = t.fraction ?? PHASES.indexOf(t.phase) / PHASES.length;
  const daySeconds = t.day_seconds || (clockAt && clockAt.daySeconds) || 180;
  clockAt = { day: t.day, fraction, daySeconds, at: performance.now() };
  drawClock();
}

function dayFraction() {
  const partEnd = (Math.floor(clockAt.fraction * PHASES.length) + 1) / PHASES.length;
  return Math.min(clockAt.fraction + (performance.now() - clockAt.at) / 1000 / clockAt.daySeconds, partEnd - 1e-6);
}

function drawClock() {
  if (!clockAt) return;
  const minutes = (Math.floor((360 + dayFraction() * 1440) / 10) * 10) % 1440;
  const hour = Math.floor(minutes / 60);
  $("clock").textContent = `Day ${clockAt.day}, ${hour % 12 || 12}:${String(minutes % 60).padStart(2, "0")} ${hour < 12 ? "am" : "pm"}`;
  drawWheel();
}

// Clockwise: the sun rises on the left, tops the wheel at noon and sets on the right; the angle only grows.
function drawWheel() {
  if (!clockAt) return;
  const turns = clockAt.day - 1 + (6 + dayFraction() * 24 - 12) / 24;
  $("wheel").style.transform = `rotate(${(turns * 360).toFixed(3)}deg)`;
}

function turnWheel() {
  if (!REDUCED_MOTION.matches) drawWheel();
  requestAnimationFrame(turnWheel);
}
setInterval(drawClock, 1000);
requestAnimationFrame(turnWheel);

function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", error);
}

async function post(path, body) {
  try {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (res.ok) return { ok: true, error: null };
    const data = await res.json().catch(() => ({}));
    return { ok: false, error: data.error || "That didn't go through. Try again." };
  } catch {
    return { ok: false, error: "Can't reach the game. Check that it is still running, then try again." };
  }
}

function setHere(place) {
  here = place;
  $("where").textContent = `You're at the ${place}`;
  setActions();
  setAsk();
}

function listening() {
  return listenUntil != null && listenUntil > Date.now() / 1000;
}

// A listen runs until its end event, or on a reload until its time is up.
function setListening(until) {
  listenUntil = until;
  setActions();
  if (until != null) setTimeout(setActions, Math.max(0, until * 1000 - Date.now()) + 100);
}

// The open tile's button: walk to the place, or look around when the player is already there.
function tileAction(place) {
  const button = el("button", { type: "button", className: "linkish tile-act", dataset: { act: place } });
  fillAction(button);
  return button;
}

function fillAction(button) {
  const at = button.dataset.act === here;
  const busy = at && listening();
  button.textContent = !at ? "Walk here" : busy ? "Just looked" : "Look around";
  button.ariaDisabled = String(busy);
  button.onclick = () => {
    if (button.ariaDisabled === "true") return;
    if (at) listenHere();
    else walkTo(button.dataset.act);
  };
}

function setActions() {
  for (const button of $("people").querySelectorAll(".tile-act")) fillAction(button);
}

async function walkTo(place) {
  const { ok, error } = await post("/api/walk", { place });
  if (!ok) setStatus(error, true);
}

async function listenHere() {
  const { ok, error } = await post("/api/listen", {});
  if (!ok) setStatus(error, true);
}

// The card's Interview button while the villager is where the player is, else where they are and a way there.
function setAsk() {
  const slot = $("card").hidden ? null : $("card").querySelector(".ask-slot");
  if (!slot) return;
  const { id, name } = slot.dataset;
  const place = villagers.find((v) => v.id === id)?.place || slot.dataset.place;
  const key = place === here ? "" : place;
  if (slot.dataset.key === key) return;
  const inside = slot.contains(document.activeElement);
  slot.dataset.key = key;
  slot.replaceChildren(...(key ? [
    el("p", { textContent: `${name} is at the ${place}.` }),
    el("button", { type: "button", className: "linkish walk-there", textContent: "Walk there", onclick: () => walkTo(place) }),
  ] : interviewForm(id, name)));
  if (inside) slot.querySelector("button").focus();
}

function interviewForm(id, name) {
  const button = el("button", { className: "primary", type: "button", textContent: "Interview" });
  const status = el("p", { className: "ask-status", role: "status" });
  const say = (text, error = false) => {
    status.textContent = text;
    status.classList.toggle("error", error);
  };
  button.addEventListener("click", async () => {
    button.disabled = true;
    say("Interviewing…");
    const { ok, error } = await post("/api/interview", { villager_id: id });
    button.disabled = false;
    if (button.isConnected) button.focus();
    if (!ok) return say(error, true);
    say(`${name} answered. It's in the feed.`);
  });
  return [el("div", { className: "ask" }, button), status];
}

// On a phone the two columns are tabs; the choice is remembered.
const TABS = ["hear", "village"];
function setTab(name) {
  $("app").dataset.tab = name;
  for (const t of TABS) {
    const tab = $(`tab-${t}`);
    tab.ariaSelected = String(t === name);
    tab.tabIndex = t === name ? 0 : -1;
  }
  try { localStorage.setItem(TAB_KEY, name); } catch { /* the choice lasts until reload */ }
  // Tiles drawn while hidden measured nothing, so the scroll cue is redone once they show.
  if (name === "village") refreshVillagers();
}
for (const t of TABS) $(`tab-${t}`).addEventListener("click", () => setTab(t));
document.querySelector(".tabs").addEventListener("keydown", (ev) => {
  const at = TABS.indexOf($("app").dataset.tab);
  const to = { ArrowLeft: at - 1, ArrowRight: at + 1, Home: 0, End: TABS.length - 1 }[ev.key];
  if (to == null) return;
  ev.preventDefault();
  const name = TABS[(to + TABS.length) % TABS.length];
  setTab(name);
  $(`tab-${name}`).focus();
});
let storedTab = null;
try { storedTab = localStorage.getItem(TAB_KEY); } catch { /* the Hear tab */ }
if (TABS.includes(storedTab)) setTab(storedTab);
// The columns are tab panels only while they are tabs, so a wide screen keeps its landmarks.
const PANELS = { hear: "hear-panel", village: "town" };
function setPanels() {
  for (const [t, id] of Object.entries(PANELS)) {
    if (phone.matches) {
      $(id).setAttribute("role", "tabpanel");
      $(id).setAttribute("aria-labelledby", `tab-${t}`);
    } else {
      $(id).removeAttribute("role");
      $(id).removeAttribute("aria-labelledby");
    }
  }
}
phone.addEventListener("change", () => {
  setPanels();
  refreshVillagers();
});
setPanels();

function setConn(state, text) {
  $("conn").dataset.state = state;
  $("conn").textContent = text;
}

// A new boot means the game restarted and numbers its events from 1 again.
function reset() {
  feed.replaceChildren();
  closeCard();
  faces.clear();
  notes = {};
  $("where").textContent = "";
  here = null;
  listenUntil = null;
  lastId = 0;
  rover = null;
  setStatus("");
}

async function loadState() {
  const res = await fetch("/api/state");
  if (res.status === 401) unknown = true;
  if (!res.ok) throw new Error(String(res.status));
  const state = await res.json();
  if (boot !== null && state.boot !== boot) reset();
  boot = state.boot;
  places = state.places;
  $("usage").textContent = state.usage.summary;
  setClock(state.time);
  // The replay goes in before the log is live, so a reload doesn't read it all out.
  feed.setAttribute("aria-live", "off");
  const stick = feed.children.length === 0 || nearBottom();
  addEvents(state.events, false);
  if (stick) feed.scrollTop = feed.scrollHeight;
  setTimeout(() => feed.setAttribute("aria-live", "polite"));
  setHere(state.place);
  villagersKey = "";
  setVillagers(state.villagers);
  setResting(state.resting);
  setCase(state.case);
  $("notebook").replaceChildren();
  note(state.notebook);
}

function receive(e) {
  if (e.kind === "villagers") {
    setVillagers(e.villagers);
  } else if (e.kind === "usage") {
    $("usage").textContent = e.usage.summary;
  } else {
    addEvents([e], true);
  }
}

// Open the socket first and hold its messages until the state has loaded, so nothing falls in between.
let retry = 1000;
// Set when the game no longer knows this browser, so only a reload brings it back.
let unknown = false;
function connect() {
  setConn("connecting", "Connecting");
  const socket = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  let held = [];
  socket.onmessage = (msg) => {
    const e = JSON.parse(msg.data);
    if (held) held.push(e); else receive(e);
  };
  socket.onopen = async () => {
    try {
      await loadState();
    } catch {
      socket.close();
      return;
    }
    held.forEach(receive);
    held = null;
    retry = 1000;
    setConn("live", "Live");
  };
  socket.onclose = (ev) => {
    if (ev.code === 1008 || unknown) {
      setConn("down", "Reload the page to rejoin the town.");
      return;
    }
    setConn("down", "Can't reach the game; retrying");
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 8000);
  };
}
connect();
</script>
