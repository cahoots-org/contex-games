name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Lint
      run: ruff check .
    - name: Test
      run: pytest whispers -q

  integration:
    name: Integration Tests (live Contex)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.25.9-pg18
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: contex
          POSTGRES_USER: contex
          POSTGRES_PASSWORD: contex_password
        options: >-
          --health-cmd "pg_isready -U contex -d contex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Boot the latest Contex release
      run: |
        docker run -d --name contex --network host \
          -e DATABASE_URL=postgresql+asyncpg://contex:contex_password@localhost:5432/contex \
          -e CONTEX_PROTECTED_MODE=false \
          ghcr.io/cahoots-org/contex:latest
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8001/health; then exit 0; fi
          sleep 2
        done
        docker logs contex
        exit 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Run Whispers integration tests
      run: WHISPERS_CONTEX_URL=http://localhost:8001/mcp pytest whispers/tests/test_contex_integration.py -v

  docker:
    name: Build Whispers Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build
      run: docker build -f whispers/Dockerfile .
